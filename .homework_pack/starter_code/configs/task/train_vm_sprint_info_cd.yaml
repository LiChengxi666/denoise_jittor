mode: train
debug: False
load_ckpt: experiments/vm_strong/checkpoint_anchor_7187.pkl

components:
  data: train_strong
  transform: vm_strong
  system: vm_sprint_info_cd
  model: vm_sprint_info_cd

loss:
  disp_loss: 1.0
  cd_loss: 0.35
  info_cd_loss: 0.03
  point_plane_loss: 0.15
  offset_reg: 0.005

optimizer:
  __target__: adam
  lr: 0.000005

trainer:
  epochs: 8
  save_every: 1
  save_last: True
  save_last_every: 1
  validate_every: 2
  log_dir: logs
  experiment_name: vm_sprint_info_cd
  log_to_file: True
  metrics_csv: metrics.csv
  log_config: True
  log_every_n_steps: 0
  grad_clip_norm: 1.0
  lr_scheduler:
    __target__: cosine
    warmup_epochs: 0
    min_lr: 0.000001
